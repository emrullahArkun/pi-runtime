<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLAN einrichten</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --ease: cubic-bezier(0.2, 0.8, 0.2, 1); }
  body { -webkit-tap-highlight-color: transparent; }
  header { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 12px 0 20px; }
  header img { height: 30px; }
  .text-button { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: none; color: var(--text); font: 600 15px var(--font); }
  .text-button .icon { font-size: 20px; color: var(--text-2); }
  h1 { margin: 0; padding: 8px 20px 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  section { padding: 24px 12px 20px; }
  .overline { display: block; margin: 0 8px 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-radius: 22px; transition: background 0.25s; }
  li.open { background: var(--info-bg); }
  .net { display: flex; align-items: center; gap: 12px; width: 100%; height: 60px; padding: 0 16px 0 18px; border: 0; border-radius: 22px; background: none; color: var(--text); font: 500 16px var(--font); text-align: left; transition: background 0.2s, transform 0.2s var(--ease); }
  .net:active { background: var(--tonal); transform: scale(0.985); }
  .net span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net .icon { font-size: 22px; color: var(--text-2); }
  .signal path { fill: none; stroke: var(--input); stroke-width: 2.2; stroke-linecap: round; }
  .signal .on { stroke: var(--text-2); }
  .signal circle { fill: var(--text-2); }
  .join { padding: 4px 16px 18px; animation: reveal 0.3s var(--ease); }
  @keyframes reveal { from { opacity: 0; transform: translateY(-6px); } }
  .field { position: relative; margin-bottom: 14px; }
  input { width: 100%; height: 56px; padding: 0 56px 0 18px; border: 1px solid var(--input); border-radius: 16px; background: #ffffff; color: var(--text); font: 400 16px var(--font); outline: none; transition: border-color 0.2s; }
  input:focus { border: 2px solid var(--primary); padding-left: 17px; }
  input::placeholder { color: var(--text-light); }
  .peek { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 22px; background: none; color: var(--text-2); font-size: 22px; }
  .hint { margin: -6px 4px 14px; font-size: 13px; color: var(--error); }
  .primary { width: 100%; height: 52px; border: 0; border-radius: 26px; background: var(--primary); color: var(--on-primary); font: 600 16px var(--font); transition: transform 0.2s var(--ease); }
  .primary:active { transform: scale(0.98); }
  .empty { display: flex; gap: 12px; align-items: flex-start; margin: 0 8px; padding: 16px 18px; border-radius: 22px; background: var(--info-bg); color: var(--text-2); line-height: 1.45; }
  .empty .icon { font-size: 22px; margin-top: 1px; }
  .sent { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16vh 28px 0; animation: reveal 0.5s var(--ease); }
  .orb { position: relative; display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 50%; background: var(--card); color: var(--primary); font-size: 44px; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--primary); opacity: 0; animation: ripple 2.6s var(--ease) infinite; }
  .ring + .ring { animation-delay: 1.3s; }
  @keyframes ripple { from { opacity: 0.45; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
  .sent h2 { margin: 36px 0 0; font-size: 22px; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <img src="big-mark.png" alt="BIG">
  <button class="text-button" id="lang" type="button">
    <svg class="icon" viewBox="0 0 24 24"><path d="m12.87 15.07-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7 1.62-4.33L19.12 17h-3.24z"/></svg>
    <span data-t="langSwitch"></span>
  </button>
</header>

<main id="choose">
  <h1 data-t="title"></h1>
  <section>
    <h2 class="overline" data-t="networks"></h2>
    <ul id="nets"></ul>
    <p class="empty" id="empty" hidden>
      <svg class="icon" viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/></svg>
      <span data-t="none"></span>
    </p>
  </section>
</main>

<main class="sent" id="sent" hidden>
  <div class="orb"><span class="ring"></span><span class="ring"></span><svg class="icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg></div>
  <h2 data-t="sentTitle"></h2>
</main>

<template id="password-tpl">
  <div class="field">
    <input type="password" name="password" autocomplete="off" autocapitalize="none" spellcheck="false" data-t-placeholder="password">
    <button class="peek" type="button" data-t-label="show">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
    </button>
  </div>
  <p class="hint" data-t="tooShort" hidden></p>
</template>

<script>
  const T = {
    de: {
      langSwitch: "Türkçe", title: "WLAN einrichten", networks: "Gefundene Netze",
      none: "Keine Netze gefunden. Schalte die Anzeige kurz aus und wieder an.",
      password: "Passwort", show: "Passwort anzeigen", tooShort: "Mindestens 8 Zeichen", connect: "Verbinden",
      sentTitle: "Schau jetzt auf den Fernseher",
    },
    tr: {
      langSwitch: "Deutsch", title: "Wi-Fi kurulumu", networks: "Bulunan ağlar",
      none: "Ağ bulunamadı. Ekranı kısa süreliğine kapatıp tekrar açın.",
      password: "Şifre", show: "Şifreyi göster", tooShort: "En az 8 karakter", connect: "Bağlan",
      sentTitle: "Şimdi televizyona bakın",
    },
  };
  const LOCK = "M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z";

  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") || (navigator.language.toLowerCase().startsWith("tr") ? "tr" : "de");
  const $ = (id) => document.getElementById(id);

  function translate(root = document) {
    document.documentElement.lang = lang;
    const t = T[lang];
    root.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    root.querySelectorAll("[data-t-label]").forEach((el) => el.setAttribute("aria-label", t[el.dataset.tLabel]));
    root.querySelectorAll("[data-t-placeholder]").forEach((el) => { el.placeholder = t[el.dataset.tPlaceholder]; });
  }

  function signalIcon(level) {
    const arcs = ["M8.5 15a5 5 0 0 1 7 0", "M5.5 12a9.2 9.2 0 0 1 13 0", "M2.5 9a13.4 13.4 0 0 1 19 0"];
    const paths = arcs.map((d, i) => `<path d="${d}"${i < level ? ' class="on"' : ""}/>`).join("");
    return `<svg class="icon signal" viewBox="0 0 24 24"><circle cx="12" cy="18.5" r="1.7"/>${paths}</svg>`;
  }

  function networkItem(net) {
    const item = document.createElement("li");
    const row = document.createElement("button");
    row.type = "button";
    row.className = "net";
    row.setAttribute("aria-expanded", "false");
    row.innerHTML = `<span></span>${net.secure ? `<svg class="icon" viewBox="0 0 24 24"><path d="${LOCK}"/></svg>` : ""}${signalIcon(net.signal)}`;
    row.querySelector("span").textContent = net.ssid;

    const form = document.createElement("form");
    form.className = "join";
    form.hidden = true;
    if (net.secure) form.append($("password-tpl").content.cloneNode(true));
    const submit = document.createElement("button");
    submit.className = "primary";
    submit.type = "submit";
    submit.dataset.t = "connect";
    form.append(submit);
    translate(form);

    const input = form.querySelector("input");
    form.querySelector(".peek")?.addEventListener("click", () => { input.type = input.type === "password" ? "text" : "password"; });
    input?.addEventListener("input", () => { form.querySelector(".hint").hidden = true; });
    row.addEventListener("click", () => toggle(item, row, form, input));
    form.addEventListener("submit", (e) => send(e, net.ssid, input, form));
    item.append(row, form);
    return item;
  }

  function toggle(item, row, form, input) {
    const opening = form.hidden;
    document.querySelectorAll("#nets li").forEach((li) => {
      li.classList.remove("open");
      li.querySelector(".net").setAttribute("aria-expanded", "false");
      li.querySelector(".join").hidden = true;
    });
    if (!opening) return;
    item.classList.add("open");
    row.setAttribute("aria-expanded", "true");
    form.hidden = false;
    input?.focus();
  }

  async function send(event, ssid, input, form) {
    event.preventDefault();
    const password = input ? input.value : "";
    if (input && password.length < 8) { form.querySelector(".hint").hidden = false; return; }
    $("choose").hidden = true;
    $("sent").hidden = false;
    if (params.get("demo")) return;
    await fetch("api/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ssid, password }) }).catch(() => {});
  }

  $("lang").addEventListener("click", () => { lang = lang === "de" ? "tr" : "de"; translate(); });

  const DEMO_NETS = [
    { ssid: "FRITZ!Box 7590 XQ", signal: 3, secure: true },
    { ssid: "Vodafone-2C8E", signal: 2, secure: true },
    { ssid: "Vodafone Hotspot", signal: 1, secure: false },
  ];

  async function start() {
    translate();
    const demo = params.get("demo");
    const networks = demo === "empty" ? [] : demo ? DEMO_NETS : await fetch("api/networks").then((r) => r.json()).catch(() => []);
    $("nets").replaceChildren(...networks.map(networkItem));
    $("empty").hidden = networks.length > 0;
    if (demo === "open" || demo === "short") document.querySelector(".net").click();
    if (demo === "short") document.querySelector(".join").requestSubmit();
    if (demo === "sent") { $("choose").hidden = true; $("sent").hidden = false; }
  }
  start();
</script>
</body>
</html>
