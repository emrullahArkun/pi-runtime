// Installed by setup.sh. unattended-upgrade takes Debian security updates only; the
// Raspberry Pi packages, Chromium and Debian point releases come along the update
// channel (kiosk-packages.sh). #clear drops the lists of Debian's 50unattended-upgrades,
// which would otherwise add every update. The 03:00 cron job reboots.
#clear Unattended-Upgrade::Origins-Pattern;
#clear Unattended-Upgrade::Allowed-Origins;
Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};
Unattended-Upgrade::Automatic-Reboot "false";
